name: touchline
description: "Touchline: football, read in seconds."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.5.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo.ttf
