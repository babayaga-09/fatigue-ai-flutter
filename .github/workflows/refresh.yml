name: refresh-data
on:
  schedule:
    - cron: "0 5 * * 2"   # Tuesdays 05:00 UTC, after the weekend's matches
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e .
      - name: Build bundle (fails, and publishes nothing, if a model stops beating its baseline)
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python -m touchline.run
      - name: Retrain and evaluate the FPL model, build the FPL bundle
        run: python -m touchline.fpl.run_fpl --train
      - name: Publish to data-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data-latest >/dev/null 2>&1 || \
            gh release create data-latest --title "Latest data" --notes "Auto-refreshed weekly." --prerelease
          gh release upload data-latest data/out/touchline-bundle.json.gz data/out/metrics.json             data/out/fpl-bundle.json.gz data/out/fpl_metrics.json             data/out/fpl_models/minutes.pkl --clobber
